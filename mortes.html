```
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
    }

    .container {
        text-align: center;
        background: #1c1c1c;
        padding: 50px;
        border-radius: 20px;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
        margin-top: 0;
        font-size: 36px;
    }

    #contador {
        font-size: 100px;
        font-weight: bold;
        margin: 30px 0;
    }

    button {
        width: 100%;
        padding: 20px;
        margin-top: 10px;
        border: none;
        border-radius: 12px;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
    }

    #morrer {
        background: #c62828;
        color: white;
    }

    #morrer:hover {
        background: #e53935;
    }

    #resetar {
        background: #444;
        color: white;
        font-size: 16px;
    }

    #resetar:hover {
        background: #555;
    }
</style>
```

</head>

<body>

```
<div class="container">
    <h1>CONTADOR DE MORTES</h1>

    <div id="contador">0</div>

    <button id="morrer">MORRI</button>
    <button id="resetar">Diminuir CONTADOR</button>
</div>

<script>
    let mortes = Number(localStorage.getItem("mortes")) || 0;

    const contador = document.getElementById("contador");
    const botaoMorrer = document.getElementById("morrer");
    const botaoResetar = document.getElementById("resetar");

    function atualizarContador() {
        contador.textContent = mortes;
        localStorage.setItem("mortes", mortes);
    }

    botaoMorrer.addEventListener("click", function() {
        mortes++;
        atualizarContador();
    });

    botaoResetar.addEventListener("click", function() {
        mortes -= 1;
        atualizarContador();
    });

    atualizarContador();
</script>
```

</body>
